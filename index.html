<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club 5 Hermanos</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:20px}
.card{max-width:520px;margin:auto;background:#1d1d1d;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0008}
h1{text-align:center;margin-top:0} .sub{text-align:center;color:#ddd}
label{display:block;margin-top:16px;font-weight:700} input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #555;margin-top:7px;font-size:16px}
input{background:#292929;color:#fff} button{background:#fff;color:#111;font-weight:700;border:0;margin-top:20px;cursor:pointer}
button:disabled{opacity:0.6;cursor:not-allowed}
.note{font-size:13px;color:#bbb;margin-top:16px;line-height:1.4}
.success{display:none;text-align:center}.success h2{font-size:25px}
.checkbox-label{display:flex;align-items:center;gap:10px;margin-top:18px;font-weight:normal}
.checkbox-label input{width:auto;margin:0}
</style>
</head>
<body>
<div class="card">
  <div id="form">
    <h1>🍕 CLUB 5 HERMANOS</h1>
    <p class="sub">Registrate gratis y empezá a sumar puntos.</p>
    
    <label>Nombre y apellido *</label>
    <input id="name" required placeholder="Ej: Juan Pérez">
    
    <label>WhatsApp *</label>
    <input id="phone" inputmode="tel" required placeholder="Ej: 11 2345-6789">
    
    <label>Fecha de nacimiento (opcional)</label>
    <input id="birth" type="date">
    
    <label class="checkbox-label">
      <input id="promo" type="checkbox">
      Quiero recibir promociones y beneficios por WhatsApp
    </label>
    
    <button id="btn" onclick="register()">REGISTRARME</button>
    
    <p class="note"> Por cada compra de $10.000 o más. sumas 1 punto. Cada 5 puntos tenes una bonificación .</p>
  </div>
  
  <div id="ok" class="success">
    <h2>🎉 ¡Bienvenido al Club 5 Hermanos!</h2>
    <p id="msg"></p>
    <p>Ya recibimos tu registro. Guardá nuestro WhatsApp para identificarte en tus próximas compras.</p>
  </div>
</div>

<script>
function register() {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const birth = document.getElementById('birth').value;
  const promo = document.getElementById('promo').checked ? "Sí" : "No";

  if (!name || !phone) {
    alert('Completá nombre y WhatsApp.');
    return;
  }

  const tuNumero = "5491156355038";

  const mensaje = "🍕 *Nuevo registro - Club 5 Hermanos*%0A%0A" +
                  "*Nombre:* " + name + "%0A" +
                  "*WhatsApp:* " + phone + "%0A" +
                  "*Fecha nacimiento:* " + (birth || "No indicada") + "%0A" +
                  "*Quiere promociones:* " + promo;

  // Abrimos WhatsApp
  window.open("https://wa.me/" + tuNumero + "?text=" + mensaje, "_blank");

  // Mostramos el mensaje de éxito
  document.getElementById('form').style.display = 'none';
  document.getElementById('ok').style.display = 'block';
  document.getElementById('msg').textContent = 'Registro enviado para ' + name + '.';
}
</script>
</body>
</html>
